  <text x="100" y="176" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="1">DURAND</text>
  <text x="100" y="186" text-anchor="middle" fill="#6c757d" font-family="'Courier New', monospace" font-size="7" font-weight="bold" letter-spacing="1">BLACKSMITH</text>
