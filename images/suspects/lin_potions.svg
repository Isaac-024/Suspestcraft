<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" shape-rendering="crispEdges">
  <!-- Background Card -->
  <rect width="200" height="200" fill="#0a0910"/>
  <rect x="6" y="6" width="188" height="188" fill="#15141f" stroke="#55ff55" stroke-width="3"/>
  <rect x="12" y="12" width="176" height="176" fill="#1c1a29"/>

  <!-- Character Artwork -->
  <g>
    
  <!-- Green Hood / Robe -->
  <polygon points="100,16 55,54 145,54" fill="#1b4d24"/>
  <rect x="66" y="38" width="68" height="52" fill="#2a7a3a"/>
  <!-- Face inside hood -->
  <rect x="74" y="48" width="52" height="38" fill="#fcd0a1"/>
  <rect x="80" y="58" width="8" height="8" fill="#113317"/>
  <rect x="112" y="58" width="8" height="8" fill="#113317"/>
  <!-- Robe Body -->
  <rect x="45" y="96" width="110" height="66" fill="#2a7a3a"/>
  <rect x="78" y="96" width="44" height="66" fill="#1b4d24"/>
  <!-- Holding Glowing Acid-Green Poison Flask -->
  <ellipse cx="150" cy="120" rx="18" ry="24" fill="#39ff14" stroke="#166606" stroke-width="3"/>
  <rect x="145" y="92" width="10" height="12" fill="#80562e"/>
  <circle cx="150" cy="122" r="8" fill="#baffc7"/>

  </g>

  <!-- Name Banner -->
  <rect x="12" y="162" width="176" height="26" fill="#0d0c14" stroke="#55ff55" stroke-width="2"/>
  <text x="100" y="176" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="1">LIN</text>
  <text x="100" y="186" text-anchor="middle" fill="#55ff55" font-family="'Courier New', monospace" font-size="7" font-weight="bold" letter-spacing="1">BOTANIST</text>
</svg>