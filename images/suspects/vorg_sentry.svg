<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" shape-rendering="crispEdges">
  <!-- Background Card -->
  <rect width="200" height="200" fill="#0a0910"/>
  <rect x="6" y="6" width="188" height="188" fill="#15141f" stroke="#6c757d" stroke-width="3"/>
  <rect x="12" y="12" width="176" height="176" fill="#1c1a29"/>

  <!-- Character Artwork -->
  <g>
    
  <rect x="65" y="22" width="70" height="38" fill="#495057" stroke="#212529" stroke-width="2"/>
  <rect x="72" y="50" width="56" height="38" fill="#f0c299"/>
  <rect x="78" y="58" width="8" height="8" fill="#000000"/>
  <rect x="114" y="58" width="8" height="8" fill="#000000"/>
  <rect x="45" y="96" width="110" height="66" fill="#343a40"/>
  <!-- Big Iron Shield -->
  <polygon points="20,80 55,80 50,140 25,140" fill="#6c757d" stroke="#212529" stroke-width="3"/>

  </g>

  <!-- Name Banner -->
  <rect x="12" y="162" width="176" height="26" fill="#0d0c14" stroke="#6c757d" stroke-width="2"/>
  <text x="100" y="176" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="1">VORG</text>
  <text x="100" y="186" text-anchor="middle" fill="#6c757d" font-family="'Courier New', monospace" font-size="7" font-weight="bold" letter-spacing="1">SENTRY</text>
</svg>