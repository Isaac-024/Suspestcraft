<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" shape-rendering="crispEdges">
  <!-- Background Card -->
  <rect width="200" height="200" fill="#0a0910"/>
  <rect x="6" y="6" width="188" height="188" fill="#15141f" stroke="#adb5bd" stroke-width="3"/>
  <rect x="12" y="12" width="176" height="176" fill="#1c1a29"/>

  <!-- Character Artwork -->
  <g>
    
  <rect x="66" y="24" width="68" height="26" fill="#242426"/>
  <rect x="72" y="48" width="56" height="42" fill="#fcd0a1"/>
  <rect x="78" y="58" width="8" height="8" fill="#141414"/>
  <rect x="114" y="58" width="8" height="8" fill="#141414"/>
  <rect x="45" y="96" width="110" height="66" fill="#495057"/>
  <!-- Big Steel Saw Blade in hand -->
  <polygon points="140,65 175,65 170,145 145,145" fill="#c4ccd4" stroke="#212529" stroke-width="2"/>

  </g>

  <!-- Name Banner -->
  <rect x="12" y="162" width="176" height="26" fill="#0d0c14" stroke="#adb5bd" stroke-width="2"/>
  <text x="100" y="176" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="1">VARREN</text>
  <text x="100" y="186" text-anchor="middle" fill="#adb5bd" font-family="'Courier New', monospace" font-size="7" font-weight="bold" letter-spacing="1">STONECUTTER</text>
</svg>