<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" shape-rendering="crispEdges">
  <!-- Background Card -->
  <rect width="200" height="200" fill="#0a0910"/>
  <rect x="6" y="6" width="188" height="188" fill="#15141f" stroke="#00b4d8" stroke-width="3"/>
  <rect x="12" y="12" width="176" height="176" fill="#1c1a29"/>

  <!-- Character Artwork -->
  <g>
    
  <rect x="62" y="20" width="76" height="30" fill="#e0e1dd"/>
  <rect x="72" y="48" width="56" height="40" fill="#fcd0a1"/>
  <rect x="78" y="58" width="8" height="8" fill="#03045e"/>
  <rect x="114" y="58" width="8" height="8" fill="#03045e"/>
  <rect x="45" y="94" width="110" height="68" fill="#0077b6"/>
  <!-- Blue Spellbook in hand -->
  <rect x="25" y="110" width="35" height="45" fill="#03045e" stroke="#00b4d8" stroke-width="3"/>

  </g>

  <!-- Name Banner -->
  <rect x="12" y="162" width="176" height="26" fill="#0d0c14" stroke="#00b4d8" stroke-width="2"/>
  <text x="100" y="176" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="1">OMEN</text>
  <text x="100" y="186" text-anchor="middle" fill="#00b4d8" font-family="'Courier New', monospace" font-size="7" font-weight="bold" letter-spacing="1">SAGE</text>
</svg>