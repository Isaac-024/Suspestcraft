<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" shape-rendering="crispEdges">
  <!-- Background Card -->
  <rect width="200" height="200" fill="#0a0910"/>
  <rect x="6" y="6" width="188" height="188" fill="#15141f" stroke="#9d4edd" stroke-width="3"/>
  <rect x="12" y="12" width="176" height="176" fill="#1c1a29"/>

  <!-- Character Artwork -->
  <g>
    
  <!-- Pure Black Hooded Cowl -->
  <polygon points="100,16 45,54 155,54" fill="#0d0d12"/>
  <rect x="55" y="40" width="90" height="52" fill="#171721"/>
  <!-- Deep Shadow Face + Glowing Red Eyes -->
  <rect x="68" y="48" width="64" height="38" fill="#08080a"/>
  <rect x="76" y="60" width="12" height="6" fill="#ff0054"/>
  <rect x="112" y="60" width="12" height="6" fill="#ff0054"/>
  <!-- Pitch Black Robe Body -->
  <rect x="40" y="94" width="120" height="68" fill="#0d0d12"/>
  <!-- Clear Cold Water Flask -->
  <circle cx="155" cy="125" r="18" fill="#00f5d4" stroke="#0077b6" stroke-width="3"/>
  <rect x="151" y="98" width="8" height="12" fill="#80562e"/>

  </g>

  <!-- Name Banner -->
  <rect x="12" y="162" width="176" height="26" fill="#0d0c14" stroke="#9d4edd" stroke-width="2"/>
  <text x="100" y="176" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="1">MALAKOR</text>
  <text x="100" y="186" text-anchor="middle" fill="#9d4edd" font-family="'Courier New', monospace" font-size="7" font-weight="bold" letter-spacing="1">NOMAD</text>
</svg>