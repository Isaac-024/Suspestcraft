<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" shape-rendering="crispEdges">
  <!-- Background Card -->
  <rect width="200" height="200" fill="#0a0910"/>
  <rect x="6" y="6" width="188" height="188" fill="#15141f" stroke="#f72585" stroke-width="3"/>
  <rect x="12" y="12" width="176" height="176" fill="#1c1a29"/>

  <!-- Character Artwork -->
  <g>
    
  <rect x="65" y="24" width="70" height="36" fill="#4d2411"/>
  <rect x="72" y="44" width="56" height="42" fill="#fcd0a1"/>
  <rect x="78" y="54" width="8" height="8" fill="#24140b"/>
  <rect x="114" y="54" width="8" height="8" fill="#24140b"/>
  <!-- Dress -->
  <rect x="45" y="95" width="110" height="67" fill="#693043"/>
  <!-- Bright Magenta Wool Scarf wrapped around neck -->
  <rect x="52" y="85" width="96" height="22" fill="#f72585" stroke="#a80a53" stroke-width="2"/>
  <rect x="110" y="98" width="22" height="50" fill="#f72585" stroke="#a80a53" stroke-width="2"/>

  </g>

  <!-- Name Banner -->
  <rect x="12" y="162" width="176" height="26" fill="#0d0c14" stroke="#f72585" stroke-width="2"/>
  <text x="100" y="176" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="1">CLARA</text>
  <text x="100" y="186" text-anchor="middle" fill="#f72585" font-family="'Courier New', monospace" font-size="7" font-weight="bold" letter-spacing="1">WEAVER</text>
</svg>