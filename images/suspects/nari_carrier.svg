<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" shape-rendering="crispEdges">
  <!-- Background Card -->
  <rect width="200" height="200" fill="#0a0910"/>
  <rect x="6" y="6" width="188" height="188" fill="#15141f" stroke="#d4a373" stroke-width="3"/>
  <rect x="12" y="12" width="176" height="176" fill="#1c1a29"/>

  <!-- Character Artwork -->
  <g>
    
  <rect x="62" y="22" width="76" height="30" fill="#3b1d0a"/>
  <rect x="72" y="48" width="56" height="40" fill="#fcd0a1"/>
  <rect x="78" y="58" width="8" height="8" fill="#17120a"/>
  <rect x="114" y="58" width="8" height="8" fill="#17120a"/>
  <rect x="45" y="94" width="110" height="68" fill="#8b5e34"/>
  <!-- Canvas Sacks on shoulder -->
  <ellipse cx="40" cy="115" rx="20" ry="26" fill="#d4a373" stroke="#6f4e37" stroke-width="2"/>

  </g>

  <!-- Name Banner -->
  <rect x="12" y="162" width="176" height="26" fill="#0d0c14" stroke="#d4a373" stroke-width="2"/>
  <text x="100" y="176" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="1">NARI</text>
  <text x="100" y="186" text-anchor="middle" fill="#d4a373" font-family="'Courier New', monospace" font-size="7" font-weight="bold" letter-spacing="1">CARRIER</text>
</svg>