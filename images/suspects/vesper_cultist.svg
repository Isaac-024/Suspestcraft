<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" shape-rendering="crispEdges">
  <!-- Background Card -->
  <rect width="200" height="200" fill="#0a0910"/>
  <rect x="6" y="6" width="188" height="188" fill="#15141f" stroke="#9d4edd" stroke-width="3"/>
  <rect x="12" y="12" width="176" height="176" fill="#1c1a29"/>

  <!-- Character Artwork -->
  <g>
    
  <rect x="66" y="22" width="68" height="26" fill="#100b1a"/>
  <rect x="72" y="46" width="56" height="42" fill="#fcd0a1"/>
  <rect x="78" y="56" width="8" height="8" fill="#5a189a"/>
  <rect x="114" y="56" width="8" height="8" fill="#5a189a"/>
  <rect x="45" y="94" width="110" height="68" fill="#240046"/>
  <!-- Long Glowing Purple Laser Tuning Rod in Hand -->
  <line x1="150" y1="35" x2="150" y2="155" stroke="#7b2cbf" stroke-width="8"/>
  <polygon points="150,20 140,40 160,40" fill="#e0aaff"/>
  <circle cx="150" cy="30" r="14" fill="#c77dff" stroke="#ffffff" stroke-width="2"/>

  </g>

  <!-- Name Banner -->
  <rect x="12" y="162" width="176" height="26" fill="#0d0c14" stroke="#9d4edd" stroke-width="2"/>
  <text x="100" y="176" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="1">VESPER</text>
  <text x="100" y="186" text-anchor="middle" fill="#9d4edd" font-family="'Courier New', monospace" font-size="7" font-weight="bold" letter-spacing="1">CULTIST</text>
</svg>