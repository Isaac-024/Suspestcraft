<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" shape-rendering="crispEdges">
  <!-- Background Card -->
  <rect width="200" height="200" fill="#0a0910"/>
  <rect x="6" y="6" width="188" height="188" fill="#15141f" stroke="#ffd700" stroke-width="3"/>
  <rect x="12" y="12" width="176" height="176" fill="#1c1a29"/>

  <!-- Character Artwork -->
  <g>
    
  <!-- Crimson Headdress -->
  <rect x="60" y="20" width="80" height="28" fill="#800f2f" stroke="#ffb703" stroke-width="2"/>
  <!-- Face -->
  <rect x="70" y="44" width="60" height="42" fill="#fcd0a1"/>
  <rect x="78" y="54" width="8" height="8" fill="#2e1405"/>
  <rect x="114" y="54" width="8" height="8" fill="#2e1405"/>
  <rect x="90" y="70" width="20" height="8" fill="#541b0b"/>
  <!-- Crimson &amp; Gold Robes -->
  <rect x="45" y="96" width="110" height="66" fill="#800f2f"/>
  <rect x="80" y="96" width="40" height="66" fill="#ffb703"/>
  <!-- Large Prominent Gold Signet Ring on Hand -->
  <circle cx="45" cy="125" r="16" fill="#fcd0a1"/>
  <circle cx="45" cy="125" r="10" fill="#ffd700" stroke="#7a5500" stroke-width="3"/>
  <rect x="41" y="121" width="8" height="8" fill="#990000"/>

  </g>

  <!-- Name Banner -->
  <rect x="12" y="162" width="176" height="26" fill="#0d0c14" stroke="#ffd700" stroke-width="2"/>
  <text x="100" y="176" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="1">ZUL</text>
  <text x="100" y="186" text-anchor="middle" fill="#ffd700" font-family="'Courier New', monospace" font-size="7" font-weight="bold" letter-spacing="1">TREASURER</text>
</svg>