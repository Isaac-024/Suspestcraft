<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="240" height="180" fill="#08080d"/>
  <rect x="6" y="6" width="228" height="168" fill="#12121a" stroke="#ff9f1c" stroke-width="3"/>
  <rect x="10" y="10" width="220" height="160" fill="#171722"/>

  <!-- Top Title Banner -->
  <rect x="10" y="10" width="220" height="26" fill="#0c0c14" stroke="#ff9f1c" stroke-width="2"/>
  <text x="120" y="27" text-anchor="middle" fill="#ff9f1c" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="1">ORANGE COPPER WIRE</text>

  <!-- Clue Graphic Area -->
  <g>
    
  <!-- Lightning Rod Pole -->
  <rect x="112" y="38" width="16" height="65" fill="#a0aab5" stroke="#3e4a57" stroke-width="2"/>
  <polygon points="106,38 134,38 120,20" fill="#ffd000"/>
  <!-- Coiled Bright Orange Copper Wire -->
  <path d="M120,45 Q190,70 160,110 T90,120 T140,145" stroke="#ff7700" stroke-width="8" fill="none"/>
