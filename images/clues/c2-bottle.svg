  <circle cx="124" cy="96" r="3" fill="#39ff14"/>
  <rect x="117" y="104" width="6" height="4" fill="#000000"/>

  </g>

  <!-- Bottom Detail Tag -->
  <rect x="16" y="152" width="208" height="16" fill="#0c0c14"/>
  <text x="120" y="164" text-anchor="middle" fill="#8e8e9e" font-family="'Courier New', monospace" font-size="8" font-weight="bold" letter-spacing="1">EVIDENCE: LETHAL PLANT EXTRACT</text>
</svg>