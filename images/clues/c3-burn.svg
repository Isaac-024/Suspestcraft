<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="240" height="180" fill="#08080d"/>
  <rect x="6" y="6" width="228" height="168" fill="#12121a" stroke="#00f5d4" stroke-width="3"/>
  <rect x="10" y="10" width="220" height="160" fill="#171722"/>

  <!-- Top Title Banner -->
  <rect x="10" y="10" width="220" height="26" fill="#0c0c14" stroke="#00f5d4" stroke-width="2"/>
  <text x="120" y="27" text-anchor="middle" fill="#00f5d4" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="1">ELECTRICAL SCORCH MARK</text>

  <!-- Clue Graphic Area -->
  <g>
    
  <!-- Iron Floor Plate -->
  <rect x="40" y="40" width="160" height="100" fill="#586370" stroke="#252c36" stroke-width="3"/>
