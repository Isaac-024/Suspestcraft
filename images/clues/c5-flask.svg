<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="240" height="180" fill="#08080d"/>
  <rect x="6" y="6" width="228" height="168" fill="#12121a" stroke="#00f5d4" stroke-width="3"/>
  <rect x="10" y="10" width="220" height="160" fill="#171722"/>

  <!-- Top Title Banner -->
  <rect x="10" y="10" width="220" height="26" fill="#0c0c14" stroke="#00f5d4" stroke-width="2"/>
  <text x="120" y="27" text-anchor="middle" fill="#00f5d4" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="1">SWAPPED WATER FLASK</text>

  <!-- Clue Graphic Area -->
  <g>
    
  <!-- Pedestal in Lava -->
  <rect x="50" y="125" width="140" height="20" fill="#ff5400"/>
  <!-- Glass Flask filled with Clear Cold Water -->
  <ellipse cx="120" cy="85" rx="42" ry="42" fill="#00f5d4" stroke="#0077b6" stroke-width="4"/>
  <rect x="112" y="32" width="16" height="20" fill="#80562e" stroke="#422911" stroke-width="2"/>
  <!-- Frost Shimmer in water -->
  <polygon points="120,60 125,75 140,80 125,85 120,100 115,85 100,80 115,75" fill="#ffffff"/>
  <text x="120" y="115" text-anchor="middle" fill="#03045e" font-family="'Courier New', monospace" font-size="10" font-weight="bold">COLD WATER</text>

  </g>

  <!-- Bottom Detail Tag -->
  <rect x="16" y="152" width="208" height="16" fill="#0c0c14"/>
  <text x="120" y="164" text-anchor="middle" fill="#8e8e9e" font-family="'Courier New', monospace" font-size="8" font-weight="bold" letter-spacing="1">EVIDENCE: COLD WATER (NO FIRE RESISTANCE)</text>
</svg>