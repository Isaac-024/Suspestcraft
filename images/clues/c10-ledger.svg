  </g>

  <!-- Bottom Detail Tag -->
  <rect x="16" y="152" width="208" height="16" fill="#0c0c14"/>
  <text x="120" y="164" text-anchor="middle" fill="#8e8e9e" font-family="'Courier New', monospace" font-size="8" font-weight="bold" letter-spacing="1">EVIDENCE: MASTER RECORD SIGNED BY VESPER</text>
</svg>