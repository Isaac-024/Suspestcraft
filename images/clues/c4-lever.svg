<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="240" height="180" fill="#08080d"/>
  <rect x="6" y="6" width="228" height="168" fill="#12121a" stroke="#ffd700" stroke-width="3"/>
  <rect x="10" y="10" width="220" height="160" fill="#171722"/>

  <!-- Top Title Banner -->
  <rect x="10" y="10" width="220" height="26" fill="#0c0c14" stroke="#ffd700" stroke-width="2"/>
  <text x="120" y="27" text-anchor="middle" fill="#ffd700" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="1">GATE CONTROL LEVER</text>

  <!-- Clue Graphic Area -->
  <g>
    
  <!-- Control Box -->
  <rect x="40" y="60" width="65" height="80" fill="#3d3a45" stroke="#1b1921" stroke-width="3"/>
  <!-- Lever Arm pulled down -->
  <line x1="72" y1="95" x2="165" y2="45" stroke="#a0aab5" stroke-width="12"/>
  <circle cx="170" cy="42" r="18" fill="#d90429"/>
  <!-- Gold Signet Ring Smudge -->
  <circle cx="166" cy="44" r="10" fill="#ffd700" stroke="#8a6700" stroke-width="2"/>
  <rect x="162" y="40" width="8" height="8" fill="#800f2f"/>

  </g>

  <!-- Bottom Detail Tag -->
  <rect x="16" y="152" width="208" height="16" fill="#0c0c14"/>
  <text x="120" y="164" text-anchor="middle" fill="#8e8e9e" font-family="'Courier New', monospace" font-size="8" font-weight="bold" letter-spacing="1">EVIDENCE: GOLD SIGNET IMPRINT ON SWITCH</text>
</svg>