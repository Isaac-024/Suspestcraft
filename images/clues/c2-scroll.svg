<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="240" height="180" fill="#08080d"/>
  <rect x="6" y="6" width="228" height="168" fill="#12121a" stroke="#39ff14" stroke-width="3"/>
  <rect x="10" y="10" width="220" height="160" fill="#171722"/>

  <!-- Top Title Banner -->
  <rect x="10" y="10" width="220" height="26" fill="#0c0c14" stroke="#39ff14" stroke-width="2"/>
  <text x="120" y="27" text-anchor="middle" fill="#39ff14" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="1">POISON RECIPE SCROLL</text>

  <!-- Clue Graphic Area -->
  <g>
    
  <!-- Parchment Scroll -->
  <rect x="45" y="38" width="150" height="106" fill="#f5f0dc" stroke="#47664c" stroke-width="3"/>
  <!-- Green Poison Icon Drawing -->
  <polygon points="65,60 85,60 95,95 55,95" fill="#39ff14" stroke="#1c5c24" stroke-width="2"/>
  <!-- Text on scroll -->
  <text x="105" y="65" fill="#1b4d24" font-family="'Courier New', monospace" font-size="10" font-weight="bold">POISON RECIPE</text>
  <line x1="105" y1="75" x2="180" y2="75" stroke="#1b4d24" stroke-width="2"/>
  <line x1="105" y1="85" x2="165" y2="85" stroke="#1b4d24" stroke-width="2"/>
  <text x="75" y="125" fill="#0d3b14" font-family="'Courier New', monospace" font-size="12" font-weight="900">AUTHOR: LIN</text>

  </g>

  <!-- Bottom Detail Tag -->
  <rect x="16" y="152" width="208" height="16" fill="#0c0c14"/>
  <text x="120" y="164" text-anchor="middle" fill="#8e8e9e" font-family="'Courier New', monospace" font-size="8" font-weight="bold" letter-spacing="1">EVIDENCE: FORMULA SIGNED BY LIN</text>
</svg>