<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="240" height="180" fill="#08080d"/>
  <rect x="6" y="6" width="228" height="168" fill="#12121a" stroke="#9d4edd" stroke-width="3"/>
  <rect x="10" y="10" width="220" height="160" fill="#171722"/>

  <!-- Top Title Banner -->
  <rect x="10" y="10" width="220" height="26" fill="#0c0c14" stroke="#9d4edd" stroke-width="2"/>
  <text x="120" y="27" text-anchor="middle" fill="#9d4edd" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="1">PURPLE TUNING ROD</text>

  <!-- Clue Graphic Area -->
  <g>
    
  <!-- Stand Mount -->
  <rect x="40" y="125" width="160" height="20" fill="#240046" stroke="#5a189a" stroke-width="2"/>
  <!-- Metallic Violet Tuning Rod -->
  <line x1="45" y1="120" x2="185" y2="40" stroke="#7b2cbf" stroke-width="12"/>
  <line x1="45" y1="120" x2="185" y2="40" stroke="#e0aaff" stroke-width="4"/>
  <!-- Hexagonal Rod Tip with Energy Corona -->
  <polygon points="185,40 175,20 195,15 210,35 195,55 175,50" fill="#c77dff" stroke="#ffffff" stroke-width="3"/>
  <circle cx="190" cy="35" r="6" fill="#ffffff"/>

  </g>

  <!-- Bottom Detail Tag -->
  <rect x="16" y="152" width="208" height="16" fill="#0c0c14"/>
  <text x="120" y="164" text-anchor="middle" fill="#8e8e9e" font-family="'Courier New', monospace" font-size="8" font-weight="bold" letter-spacing="1">EVIDENCE: RESONANT OPTICAL ALIGNER</text>
</svg>