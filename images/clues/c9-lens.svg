<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="240" height="180" fill="#08080d"/>
  <rect x="6" y="6" width="228" height="168" fill="#12121a" stroke="#c77dff" stroke-width="3"/>
  <rect x="10" y="10" width="220" height="160" fill="#171722"/>

  <!-- Top Title Banner -->
  <rect x="10" y="10" width="220" height="26" fill="#0c0c14" stroke="#c77dff" stroke-width="2"/>
  <text x="120" y="27" text-anchor="middle" fill="#c77dff" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="1">FOCUSED LASER BEAM</text>

  <!-- Clue Graphic Area -->
  <g>
    
  <!-- Crystal Prism on Left -->
  <polygon points="35,45 65,45 50,115" fill="#e0aaff" stroke="#5a189a" stroke-width="3"/>
  <!-- Temple Altar on Right -->
  <rect x="165" y="65" width="45" height="65" fill="#240046" stroke="#7b2cbf" stroke-width="3"/>
  <!-- Concentrated Violet Laser Ray -->
  <line x1="50" y1="80" x2="165" y2="95" stroke="#c77dff" stroke-width="10"/>
  <line x1="50" y1="80" x2="165" y2="95" stroke="#ffffff" stroke-width="3"/>
  <!-- Impact Burn on Altar -->
  <circle cx="165" cy="95" r="14" fill="#ffd000"/>

  </g>

  <!-- Bottom Detail Tag -->
  <rect x="16" y="152" width="208" height="16" fill="#0c0c14"/>
  <text x="120" y="164" text-anchor="middle" fill="#8e8e9e" font-family="'Courier New', monospace" font-size="8" font-weight="bold" letter-spacing="1">EVIDENCE: CRYSTAL PRISM DEFLECTION</text>
</svg>