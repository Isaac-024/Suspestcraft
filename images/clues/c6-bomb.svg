<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="240" height="180" fill="#08080d"/>
  <rect x="6" y="6" width="228" height="168" fill="#12121a" stroke="#ffea00" stroke-width="3"/>
  <rect x="10" y="10" width="220" height="160" fill="#171722"/>

  <!-- Top Title Banner -->
  <rect x="10" y="10" width="220" height="26" fill="#0c0c14" stroke="#ffea00" stroke-width="2"/>
  <text x="120" y="27" text-anchor="middle" fill="#ffea00" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="1">YELLOW SULFUR BOMB</text>

  <!-- Clue Graphic Area -->
  <g>
    
  <!-- Demolition Sphere (Bright Yellow) -->
  <circle cx="120" cy="95" r="44" fill="#ffea00" stroke="#bfa600" stroke-width="4"/>
  <circle cx="120" cy="95" r="28" fill="#ffd000"/>
  <!-- Fuse & Cap -->
  <rect x="112" y="38" width="16" height="16" fill="#3a3a45"/>
  <path d="M120,38 Q140,15 160,25" stroke="#ff5400" stroke-width="4" fill="none"/>
  <polygon points="160,25 170,18 165,30" fill="#ffd000"/>
  <!-- Stamped Alchemical S -->
  <text x="120" y="106" text-anchor="middle" fill="#3b2b00" font-family="'Courier New', monospace" font-size="32" font-weight="900">S</text>

  </g>

  <!-- Bottom Detail Tag -->
  <rect x="16" y="152" width="208" height="16" fill="#0c0c14"/>
  <text x="120" y="164" text-anchor="middle" fill="#8e8e9e" font-family="'Courier New', monospace" font-size="8" font-weight="bold" letter-spacing="1">EVIDENCE: CHARGED DEMOLITION SPHERE</text>
</svg>