<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="240" height="180" fill="#08080d"/>
  <rect x="6" y="6" width="228" height="168" fill="#12121a" stroke="#00ffff" stroke-width="3"/>
  <rect x="10" y="10" width="220" height="160" fill="#171722"/>

  <!-- Top Title Banner -->
  <rect x="10" y="10" width="220" height="26" fill="#0c0c14" stroke="#00ffff" stroke-width="2"/>
  <text x="120" y="27" text-anchor="middle" fill="#00ffff" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="1">ACOUSTIC TUNING FORK</text>

  <!-- Clue Graphic Area -->
  <g>
    
  <!-- Pedestal -->
  <rect x="40" y="125" width="160" height="20" fill="#0a192f" stroke="#0077b6" stroke-width="2"/>
  <!-- Steel Tuning Fork -->
  <rect x="114" y="75" width="12" height="55" fill="#90e0ef" stroke="#03045e" stroke-width="2"/>
  <path d="M90,35 L90,85 L150,85 L150,35" stroke="#90e0ef" stroke-width="12" fill="none"/>
  <path d="M90,35 L90,85 L150,85 L150,35" stroke="#00ffff" stroke-width="4" fill="none"/>
  <!-- Sonic Wave Rings radiating -->
  <circle cx="120" cy="55" r="40" fill="none" stroke="#00ffff" stroke-width="3" stroke-dasharray="6 6"/>
  <circle cx="120" cy="55" r="25" fill="none" stroke="#00ffff" stroke-width="2"/>

  </g>

  <!-- Bottom Detail Tag -->
  <rect x="16" y="152" width="208" height="16" fill="#0c0c14"/>
  <text x="120" y="164" text-anchor="middle" fill="#8e8e9e" font-family="'Courier New', monospace" font-size="8" font-weight="bold" letter-spacing="1">EVIDENCE: VIBRATING RESONATOR ON SENSOR</text>
</svg>