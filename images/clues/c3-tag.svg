<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="240" height="180" fill="#08080d"/>
  <rect x="6" y="6" width="228" height="168" fill="#12121a" stroke="#ff9f1c" stroke-width="3"/>
  <rect x="10" y="10" width="220" height="160" fill="#171722"/>

  <!-- Top Title Banner -->
  <rect x="10" y="10" width="220" height="26" fill="#0c0c14" stroke="#ff9f1c" stroke-width="2"/>
  <text x="120" y="27" text-anchor="middle" fill="#ff9f1c" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="1">WIRE SPOOL TAG</text>

  <!-- Clue Graphic Area -->
  <g>
    
  <!-- Copper Spool -->
  <circle cx="75" cy="90" r="38" fill="#d95f02" stroke="#7a3400" stroke-width="4"/>
  <circle cx="75" cy="90" r="16" fill="#12121a"/>
  <!-- Label Tag -->
  <polygon points="110,50 215,50 205,130 100,130" fill="#ffffff" stroke="#d95f02" stroke-width="3"/>
  <text x="155" y="75" text-anchor="middle" fill="#241405" font-family="'Courier New', monospace" font-size="10" font-weight="bold">COPPER CABLE</text>
  <line x1="115" y1="85" x2="195" y2="85" stroke="#d95f02" stroke-width="2"/>
  <text x="155" y="110" text-anchor="middle" fill="#d90429" font-family="'Courier New', monospace" font-size="12" font-weight="900">VANCE - ENG</text>

  </g>

  <!-- Bottom Detail Tag -->
  <rect x="16" y="152" width="208" height="16" fill="#0c0c14"/>
  <text x="120" y="164" text-anchor="middle" fill="#8e8e9e" font-family="'Courier New', monospace" font-size="8" font-weight="bold" letter-spacing="1">EVIDENCE: LABELED TO VANCE</text>
</svg>