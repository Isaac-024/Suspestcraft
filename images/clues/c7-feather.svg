<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="240" height="180" fill="#08080d"/>
  <rect x="6" y="6" width="228" height="168" fill="#12121a" stroke="#f72585" stroke-width="3"/>
  <rect x="10" y="10" width="220" height="160" fill="#171722"/>

  <!-- Top Title Banner -->
  <rect x="10" y="10" width="220" height="26" fill="#0c0c14" stroke="#f72585" stroke-width="2"/>
  <text x="120" y="27" text-anchor="middle" fill="#f72585" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="1">LANDING TARGET BEACON</text>

  <!-- Clue Graphic Area -->
  <g>
    
  <!-- Balcony Stone Floor -->
  <rect x="40" y="38" width="160" height="106" fill="#241b36" stroke="#4a3b63" stroke-width="3"/>
  <!-- Target Crosshair Marker (Bright Purple/Pink) -->
  <circle cx="120" cy="85" r="32" fill="none" stroke="#f72585" stroke-width="4"/>
  <circle cx="120" cy="85" r="16" fill="none" stroke="#f72585" stroke-width="3"/>
  <line x1="120" y1="45" x2="120" y2="125" stroke="#f72585" stroke-width="3"/>
  <line x1="80" y1="85" x2="160" y2="85" stroke="#f72585" stroke-width="3"/>
  <!-- Stenciled Name -->
  <text x="120" y="132" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="12" font-weight="900">AGENT: NYX</text>

  </g>

  <!-- Bottom Detail Tag -->
  <rect x="16" y="152" width="208" height="16" fill="#0c0c14"/>
  <text x="120" y="164" text-anchor="middle" fill="#8e8e9e" font-family="'Courier New', monospace" font-size="8" font-weight="bold" letter-spacing="1">EVIDENCE: BALCONY DROP MARKER SIGNED NYX</text>
</svg>