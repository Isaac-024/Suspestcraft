<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="240" height="180" fill="#08080d"/>
  <rect x="6" y="6" width="228" height="168" fill="#12121a" stroke="#ffb703" stroke-width="3"/>
  <rect x="10" y="10" width="220" height="160" fill="#171722"/>

  <!-- Top Title Banner -->
  <rect x="10" y="10" width="220" height="26" fill="#0c0c14" stroke="#ffb703" stroke-width="2"/>
  <text x="120" y="27" text-anchor="middle" fill="#ffb703" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="1">ENGINEER TOOL CRATE</text>

  <!-- Clue Graphic Area -->
  <g>
    
  <!-- Heavy Wooden Maintenance Crate -->
  <rect x="40" y="38" width="160" height="106" fill="#8c5828" stroke="#4a2a0c" stroke-width="4"/>
  <!-- Cross Bracing -->
  <line x1="40" y1="38" x2="200" y2="144" stroke="#4a2a0c" stroke-width="4"/>
  <line x1="40" y1="144" x2="200" y2="38" stroke="#4a2a0c" stroke-width="4"/>
  <!-- Yellow Stenciled Plate -->
  <rect x="55" y="70" width="130" height="42" fill="#12121a" stroke="#ffd000" stroke-width="2"/>
  <text x="120" y="96" text-anchor="middle" fill="#ffd000" font-family="'Courier New', monospace" font-size="15" font-weight="900">ENG: BRAK</text>

  </g>

  <!-- Bottom Detail Tag -->
  <rect x="16" y="152" width="208" height="16" fill="#0c0c14"/>
  <text x="120" y="164" text-anchor="middle" fill="#8e8e9e" font-family="'Courier New', monospace" font-size="8" font-weight="bold" letter-spacing="1">EVIDENCE: STENCILED TO BRAK</text>
</svg>